<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M3DIIR Studio · J.A.R.V.I.S. OS</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<style>
:root{
  --bg:#07101B; --bg2:#0A1520; --card:#0D1E2D; --card2:#111F30; --card3:#152435;
  --bd:#162540; --bd2:#1C2E44;
  --teal:#06C8D8; --teal2:#04A0AE; --teal-glow:rgba(6,200,216,.18);
  --red:#EF4444; --green:#10B981; --amber:#F59E0B; --purple:#8B5CF6; --blue:#3B82F6;
  --tx:#D8EAF5; --tx2:#5E7E96; --tx3:#2E4A60;
  --font:'DM Sans',sans-serif; --mono:'DM Mono',monospace;
  --r:12px; --r-sm:8px; --r-lg:16px;
  --sh:0 4px 24px rgba(0,0,0,.45); --sb:200px;
}
[data-theme="light"]{
  --bg:#EEF3FA; --bg2:#E4EDF6; --card:#FFFFFF; --card2:#F5F8FC; --card3:#EBF1F8;
  --bd:#C8D8E8; --bd2:#B8CAD8;
  --tx:#1A2A3A; --tx2:#5A7085; --tx3:#90A8BE;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--font);font-size:13px;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px;}

.app{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:var(--sb);flex:0 0 var(--sb);background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}

.sb-top{padding:16px 14px 12px;border-bottom:1px solid var(--bd);}
.sb-logo{display:flex;align-items:center;gap:9px;}
.logo-box{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--teal),#0480A8);display:flex;align-items:center;justify-content:center;flex:none;}
.logo-box svg{width:14px;height:14px;color:#fff;}
.logo-txt{font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--tx);}
.logo-sub{font-size:9px;color:var(--tx2);font-family:var(--mono);margin-top:1px;letter-spacing:.05em;}
.sb-nav{flex:1;padding:8px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
.nav-lbl{font-size:9px;font-weight:700;color:var(--tx3);letter-spacing:.1em;text-transform:uppercase;padding:10px 8px 5px;}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-sm);border:none;background:none;color:var(--tx2);text-align:left;font-size:12px;font-weight:500;width:100%;cursor:pointer;transition:all .12s;}
.nav-item svg{width:14px;height:14px;flex:none;}
.nav-item:hover{background:var(--card);color:var(--tx);}
.nav-item.active{background:rgba(6,200,216,.12);color:var(--teal);font-weight:600;}
.nav-badge{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--red);color:#fff;padding:1px 6px;border-radius:10px;}
.fila-dot-row{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 28px;font-size:11px;color:var(--tx2);}
.fila-dot{width:8px;height:8px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.2);}

.topbar{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--bd);background:var(--bg2);flex-shrink:0;}
.tb-title{font-size:12px;font-weight:700;color:var(--tx);white-space:nowrap;letter-spacing:.05em;}
.tb-grow{flex:1;}
.tb-search{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r-sm);padding:6px 12px;min-width:220px;}
.tb-search svg{width:12px;height:12px;color:var(--tx2);}
.tb-search input{background:none;border:none;color:var(--tx);font-size:12px;width:100%;outline:none;}
.tb-btn{width:30px;height:30px;border-radius:7px;background:var(--card);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tx2);}
.tb-btn:hover{background:var(--card2);color:var(--tx);}
.tb-avatar{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--teal),var(--purple));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex:none;}
.undo-btn{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:var(--r-sm);background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.3);color:var(--purple);font-size:11px;font-weight:600;cursor:pointer;}
.undo-btn:disabled{opacity:.35;cursor:not-allowed;}

.content-area{flex:1;overflow:auto;padding:16px;}
.dashboard-grid{display:grid;grid-template-columns:1fr 280px;gap:16px;}
.center-col{display:flex;flex-direction:column;gap:14px;min-width:0;}
.right-col{display:flex;flex-direction:column;gap:14px;}

.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.sec-title{font-size:11px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:6px;}
.sec-title .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 6px var(--teal);}

.printer-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.printer-card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r-lg);overflow:hidden;}
.printer-card.active-printer{border-color:rgba(6,200,216,.35);box-shadow:0 0 12px rgba(6,200,216,.08);}
.pc-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--bd);}
.pc-title{font-size:12px;font-weight:700;}
.pc-sub{font-size:10px;color:var(--tx2);}
.pc-toggle{width:36px;height:20px;border-radius:20px;border:none;cursor:pointer;position:relative;transition:background .2s;}
.pc-toggle.on{background:var(--teal);}
.pc-toggle.off{background:var(--bd2);}
.pc-toggle::after{content:'';width:14px;height:14px;border-radius:50%;background:#fff;position:absolute;top:3px;transition:left .2s;}
.pc-toggle.on::after{left:19px;}
.pc-toggle.off::after{left:3px;}

.printer-preview{height:110px;background:var(--card2);display:flex;align-items:center;justify-content:center;position:relative;}
.live-badge{display:inline-flex;align-items:center;gap:4px;background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;}
.live-dot{width:5px;height:5px;border-radius:50%;background:#fff;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

.printer-temp-zone{padding:10px 14px;}
.temp-val{font-family:var(--mono);font-size:20px;font-weight:500;color:var(--teal);}
.progress-row{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--bd);}
.progress-bar{flex:1;height:5px;background:var(--bd2);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),#04E8F8);transition:width .4s;}

.revenue-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.revenue-card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r-lg);padding:14px;}
.rev-lbl{font-size:10px;font-weight:700;color:var(--tx2);text-transform:uppercase;}
.rev-val{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--tx);margin-top:4px;}

.viewer-card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r-lg);overflow:hidden;}
.viewer-canvas{width:100%;height:190px;display:block;cursor:grab;}
.viewer-canvas:active{cursor:grabbing;}
.color-picker-row{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--bd);background:var(--card2);align-items:center;}
.color-swatch{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .12s;}
.color-swatch:hover,.color-swatch.selected{border-color:#fff;transform:scale(1.2);}

.gauge-card,.ads-card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r-lg);padding:14px;}
.gauge-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.gauge-info{flex:1;}
.gauge-name{font-size:12px;font-weight:600;}
.gauge-grams{font-family:var(--mono);font-size:10px;color:var(--tx2);}

.ads-map{background:var(--card2);border-radius:var(--r-sm);height:80px;position:relative;overflow:hidden;margin:10px 0;}
.ads-circle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:50%;background:rgba(6,200,216,.15);border:1px dashed var(--teal);}
.ads-pin{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:8px;height:8px;border-radius:50%;background:var(--teal);}

.data-table{width:100%;border-collapse:collapse;font-size:12px;text-align:left;}
.data-table th{padding:10px 12px;background:var(--card2);color:var(--tx2);font-weight:600;border-bottom:1px solid var(--bd);}
.data-table td{padding:10px 12px;border-bottom:1px solid var(--bd);color:var(--tx);}
.btn-sm{padding:4px 8px;border-radius:4px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);font-size:11px;cursor:pointer;}
.btn-sm:hover{border-color:var(--teal);color:var(--teal);}
.btn-primary{background:var(--teal);color:#07101B;font-weight:700;border:none;padding:8px 14px;border-radius:var(--r-sm);cursor:pointer;}

.jarvis-fab{position:fixed;bottom:20px;right:20px;width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--teal),#0480A8);border:none;color:#07101B;cursor:pointer;box-shadow:0 4px 20px rgba(6,200,216,.4);z-index:40;display:flex;align-items:center;justify-content:center;font-size:20px;}
.jarvis-panel{position:fixed;right:0;top:0;bottom:0;width:380px;background:var(--bg2);border-left:1px solid var(--bd);display:flex;flex-direction:column;z-index:45;transform:translateX(100%);transition:transform .25s ease;}
.jarvis-panel.open{transform:translateX(0);}
.jp-header{display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--bd);}
.jp-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
.msg-ai,.msg-user{max-width:88%;padding:10px 12px;border-radius:10px;font-size:12px;line-height:1.4;}
.msg-ai{background:var(--card);border:1px solid var(--bd);color:var(--tx);align-self:flex-start;}
.msg-user{background:rgba(6,200,216,.15);border:1px solid rgba(6,200,216,.3);align-self:flex-end;}
.jp-input-row{display:flex;gap:8px;padding:12px;border-top:1px solid var(--bd);}
.jp-input{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:var(--r-sm);padding:8px;color:var(--tx);outline:none;}

.toast{position:fixed;bottom:80px;right:20px;background:var(--card2);border:1px solid var(--bd);color:var(--tx);padding:10px 16px;border-radius:var(--r-sm);font-size:12px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;}
.toast.show{opacity:1;}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;}
.pill-ok{background:rgba(16,185,129,.15);color:var(--green);}
.pill-warn{background:rgba(245,158,11,.15);color:var(--amber);}
.pill-err{background:rgba(239,68,68,.15);color:var(--red);}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sb-top">
      <div class="sb-logo">
        <div class="logo-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2l9 5v10l-9 5-9-5V7l9-5z"/><path d="M3 7l9 5 9-5M12 12v9"/></svg>

        Impresoras
      </button>
      <button class="nav-item" data-sec="stl" onclick="goTo('stl')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>

        <span class="nav-badge" id="badge-pedidos">0</span>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1z"/></svg>
        Configuración
      </button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="tb-title" id="tb-title">DASHBOARD</div>
      <div class="tb-grow"></div>
      <div class="tb-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        <input placeholder="Buscar cliente, modelo, estado..." id="global-search" oninput="handleSearch(this.value)">
      </div>
      <button class="undo-btn" id="undo-btn" onclick="undoAction()" disabled>Deshacer</button>

      <div class="tb-avatar">M</div>
    </div>

    <div class="content-area" id="content-area"></div>
  </div>
</div>

<button class="jarvis-fab" onclick="toggleJarvis()" title="Abrir J.A.R.V.I.S.">🤖</button>
<div class="jarvis-panel" id="jarvis-panel">
  <div class="jp-header">
    <strong style="color:var(--teal)">J.A.R.V.I.S. OS</strong>
    <span style="font-size:10px;color:var(--tx2);margin-left:auto">v2.7 Fixed Auth</span>
    <button onclick="toggleJarvis()" style="background:none;border:none;color:var(--tx2);cursor:pointer">✕</button>
  </div>
  <div class="jp-msgs" id="jp-msgs">
    <div class="msg-ai">Hola, Facundo. Soy J.A.R.V.I.S. Estoy conectado al panel y listo. ¿Qué necesitás revisar o cambiar hoy?</div>

  <div class="jp-input-row">
    <input class="jp-input" id="jp-input" placeholder="Escribí una orden o consulta..." onkeydown="if(event.key==='Enter')sendToJarvis()">
    <button class="btn-primary" onclick="sendToJarvis()">Enviar</button>
  </div>
</div>

<div class="toast" id="toast">Notificación</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   CONFIGURACIÓN DE API KEY Y ESTADO DEL TALLER
═══════════════════════════════════════════════════════════════ */

// 🔑 CLAVE DE API OFICIAL
const GEMINI_API_KEY = "AQ.Ab8RN6KCoM3nf06Gm7ATWuq-I6k4su3knxYr4lNAWuNrjpA9Iw";

const DB = {
  activeView: 'dashboard',
  searchQuery: '',
  impresoras: [
    { id: 'imp1', nombre: 'Impresora 1', modelo: 'Bambu Lab A1', activa: true, temp: 218, progreso: 68, trabajo: 'Portasahumerios Espartano' },
    { id: 'imp2', nombre: 'Impresora 2', modelo: 'Bambu Lab A3', activa: false, temp: 24, progreso: 0, trabajo: 'En espera' }
  ],
  filamentos: [
    { id: 'f1', tipo: 'PLA', color: 'Mármol', colorHex: '#D0C8B8', pesoTotal: 1000, pesoRestante: 850 },
    { id: 'f2', tipo: 'PLA', color: 'Blanco Mate', colorHex: '#F5F5F5', pesoTotal: 1000, pesoRestante: 220 },
    { id: 'f3', tipo: 'PLA', color: 'Negro', colorHex: '#1A1A1A', pesoTotal: 1000, pesoRestante: 1000 }
  ],
  pedidos: [
    { id: 'p1', cliente: 'Lucas Gomez', modelo: 'Portasahumerios Espartano', precio: 14500, estado: 'Imprimiendo', fecha: '2026-08-03' },
    { id: 'p2', cliente: 'Estudio Arq Devoto', modelo: 'Maqueta Volumétrica 1:100', precio: 48000, estado: 'Pendiente', fecha: '2026-08-04' }
  ],
  modelosSTL: [
    { id: 'm1', nombre: 'Portasahumerios Espartano.stl', pesoG: 110, tiempoMin: 140 },
    { id: 'm2', nombre: 'Organizador Escritorio.stl', pesoG: 85, tiempoMin: 90 }
  ],
  config: { moneda: '$', precioKwh: 140, consumoW: 120 }
};

let HISTORY = [];
function snapshot() {
  HISTORY.push(JSON.stringify({ impresoras: DB.impresoras, filamentos: DB.filamentos, pedidos: DB.pedidos, modelosSTL: DB.modelosSTL }));
  if (HISTORY.length > 20) HISTORY.shift();
  document.getElementById('undo-btn').disabled = false;
}

function undoAction() {
  if (!HISTORY.length) return;
  const prev = JSON.parse(HISTORY.pop());
  DB.impresoras = prev.impresoras;
  DB.filamentos = prev.filamentos;
  DB.pedidos = prev.pedidos;
  DB.modelosSTL = prev.modelosSTL;
  renderCurrentView();
  if (!HISTORY.length) document.getElementById('undo-btn').disabled = true;
  showToast('Cambio deshecho con éxito');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

/* ═══════════════════════════════════════════════════════════════
   THREE.JS REAL STL VIEWER
═══════════════════════════════════════════════════════════════ */
let threeCtx = null;

function initThree() {
  const canvas = document.getElementById('three-canvas');
  if (!canvas || typeof THREE === 'undefined') return;
  
  const w = canvas.clientWidth || 260, h = canvas.clientHeight || 190;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(document.documentElement.getAttribute('data-theme') === 'light' ? 0xF5F8FC : 0x0D1E2D);

  const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
  camera.position.set(0, 2, 5);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(w, h);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  const amb = new THREE.AmbientLight(0xffffff, 0.7);
  scene.add(amb);
  const dir = new THREE.DirectionalLight(0x06C8D8, 0.8);
  dir.position.set(5, 10, 7);
  scene.add(dir);

  const grid = new THREE.GridHelper(6, 12, 0x162540, 0x162540);
  scene.add(grid);

  const geo = new THREE.TorusKnotGeometry(0.8, 0.25, 100, 16);
  const mat = new THREE.MeshStandardMaterial({ color: 0xD0C8B8, metalness: 0.2, roughness: 0.4 });
  const mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);

  function animate() {
    requestAnimationFrame(animate);
    mesh.rotation.y += 0.005;
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  threeCtx = { scene, camera, renderer, controls, mesh, mat };
}

function setViewerColor(hex) {
  if (threeCtx && threeCtx.mat) {
    threeCtx.mat.color.set(hex);
    showToast(`Color cambiado: ${hex}`);
  }
}

function loadSTL(input) {
  const file = input.files[0];
  if (!file || !threeCtx) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const loader = new THREE.STLLoader();
      const geo = loader.parse(e.target.result);
      geo.center();

      threeCtx.scene.remove(threeCtx.mesh);
      
      geo.computeBoundingBox();
      const sz = geo.boundingBox.getSize(new THREE.Vector3());
      const maxDim = Math.max(sz.x, sz.y, sz.z);
      const scale = 2.5 / (maxDim || 1);

      const mesh = new THREE.Mesh(geo, threeCtx.mat);
      mesh.scale.setScalar(scale);
      mesh.rotation.x = -Math.PI / 2;

      threeCtx.scene.add(mesh);
      threeCtx.mesh = mesh;
      showToast(`Cargado STL: ${file.name}`);
    } catch (err) {
      showToast('Error procesando archivo STL');
    }
  };
  reader.readAsArrayBuffer(file);
}

/* ═══════════════════════════════════════════════════════════════

═══════════════════════════════════════════════════════════════ */
function togglePrinter(id) {
  snapshot();
  const imp = DB.impresoras.find(x => x.id === id);
  if (imp) {
    imp.activa = !imp.activa;
    showToast(`${imp.nombre} ${imp.activa ? 'encendida' : 'apagada'}`);
    renderCurrentView();
  }
}

function cambiarEstadoPedido(id, estado) {
  snapshot();
  const p = DB.pedidos.find(x => x.id === id);
  if (p) {
    p.estado = estado;
    showToast(`Pedido de ${p.cliente} marcado como ${estado}`);
    renderCurrentView();
  }
}

function cancelarPedido(id) {
  snapshot();
  const p = DB.pedidos.find(x => x.id === id);
  if (p) {
    p.estado = 'Cancelado';
    showToast(`Pedido cancelado`);
    renderCurrentView();
  }
}

function crearPedidoPrompt() {
  const cliente = prompt('Nombre del Cliente:');
  if (!cliente) return;
  const modelo = prompt('Modelo STL:') || 'Objeto 3D';
  const precio = Number(prompt('Precio ARS:')) || 10000;

  snapshot();
  DB.pedidos.unshift({
    id: 'p' + Date.now(),
    cliente,
    modelo,
    precio,
    estado: 'Pendiente',
    fecha: new Date().toISOString().slice(0, 10)
  });
  showToast('Pedido registrado con éxito');
  renderCurrentView();
}

function agregarImpresora() {
  const nombre = prompt('Nombre de la máquina:') || 'Impresora Nueva';
  snapshot();
  DB.impresoras.push({
    id: 'imp' + Date.now(),
    nombre,
    modelo: 'Bambu Lab A1',
    activa: false,
    temp: 20,
    progreso: 0,
    trabajo: 'Libre'
  });
  renderCurrentView();
}

function handleSearch(val) {
  DB.searchQuery = val;
  if (DB.activeView === 'pedidos') renderCurrentView();
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  if (threeCtx) {
    threeCtx.scene.background.set(next === 'light' ? 0xF5F8FC : 0x0D1E2D);
  }
}

  } catch (err) {

    msgs.innerHTML += `<div class="msg-ai" style="color:var(--red)">Error de conexión con la API de Gemini.</div>`;
  }
}

  } catch (err) {

  }
