/* --- IndexedDB Storage for 3D Binary Files (.STL / .3MF) --- */
const IDB_NAME = 'M3DIR_3D_DB';
const IDB_STORE = 'files_store';

function getIDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains(IDB_STORE)){
        db.createObjectStore(IDB_STORE);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function save3DFileInDB(key, fileBlob){
  try {
    const db = await getIDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      const store = tx.objectStore(IDB_STORE);
      const req = store.put(fileBlob, key);
      req.onsuccess = () => resolve(true);
      req.onerror = () => reject(req.error);
    });
  } catch(e) { console.error('IDB save error', e); return false; }
}

async function get3DFileFromDB(key){
  try {
    const db = await getIDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const store = tx.objectStore(IDB_STORE);
      const req = store.get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  } catch(e) { return null; }
}

const storageHelper = {
  async get(key) {
    if (window.storage && typeof window.storage.get === 'function') {
      try { return await window.storage.get(key); } catch(e) {}
    }
    try { const v = localStorage.getItem(key); return v ? { value: v } : null; } catch(e) { return null; }
  },
  async set(key, val) {
    if (window.storage && typeof window.storage.set === 'function') {
      try { return await window.storage.set(key, val); } catch(e) {}
    }
    try { localStorage.setItem(key, val); } catch(e) {}
  }
};

async function loadAll(){
  for(const k of ['pedidos','filamentos','modelos','presupuestos','gastos','stock','plantillas']){
    try { 
      const r = await storageHelper.get(KEYS[k]); 
      if(r && r.value) DB[k] = JSON.parse(r.value);
      else if(k==='plantillas') DB[k] = DEFAULT_PLANTILLAS;
      else DB[k] = [];
    } catch(e){ DB[k] = k==='plantillas'? DEFAULT_PLANTILLAS : []; }
  }
  try { const r = await storageHelper.get(KEYS.config); if(r && r.value) DB.config = {...DB.config, ...JSON.parse(r.value)}; } catch(e){}
  try { const r = await storageHelper.get(KEYS.finanzas); if(r && r.value) DB.finanzas = {...DB.finanzas, ...JSON.parse(r.value)}; } catch(e){}
}

async function save(key){
  try { await storageHelper.set(KEYS[key], JSON.stringify(DB[key])); } catch(e){ toast('Error al guardar datos'); }
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function toast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => {
    t.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
  }, 2200);
}

function money(n){ 
  const c = DB.config.moneda || '$'; 
  return c + (Number(n||0)).toLocaleString('es-AR', {maximumFractionDigits: 0}); 
}

function fmtDate(d){ 
  if(!d) return '—'; 
  const dt = new Date(d + 'T00:00:00'); 
  return dt.toLocaleDateString('es-AR', {day: '2-digit', month: 'short'}); 
}

function todayStr(){ return new Date().toISOString().slice(0,10); }

function esc(s){ 
  if(s===undefined||s===null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;'); 
}

function getOrderItems(p){
  if(p.items && Array.isArray(p.items) && p.items.length > 0){
    return p.items;
  }
  return [{
    id: uid(),
    modeloId: p.modeloSelect || '',
    modeloNombre: p.modelo || 'Pieza / Modelo libre',
    color: p.color || '',
    cantidad: Number(p.cantidad || 1),
    precio: Number(p.precio || 0),
    gramos: Number(p.gramosUsados || 0),
    tiempoHoras: Number(p.tiempoHoras || 0)
  }];
}

function calcularDesglosePedido(p){
  const items = getOrderItems(p);
  let totalGramos = 0;
  let totalHoras = 0;
  let totalPrecio = 0;

  items.forEach(it => {
    const qty = Number(it.cantidad || 1);
    totalGramos += Number(it.gramos || 0) * qty;
    totalHoras += Number(it.tiempoHoras || (Number(it.gramos||0)/15)) * qty;
    totalPrecio += Number(it.precio || 0);
  });

  if(totalPrecio === 0 && p.precio) totalPrecio = Number(p.precio);

  const modo = DB.config.modoReparto || 'costo_real';

  if(modo === 'porcentajes'){
    const pctG = Number(DB.config.pctGanancia || 50);
    const pctF = Number(DB.config.pctFondoImpresora || 20);
    const pctMat = Number(DB.config.pctFilamento || 20);
    const pctLuz = Number(DB.config.pctLuz || 10);

    return {
      filamento: Math.round(totalPrecio * (pctMat / 100)),
      luz: Math.round(totalPrecio * (pctLuz / 100)),
      ahorroImpresora: Math.round(totalPrecio * (pctF / 100)),
      gastoPropio: Math.round(totalPrecio * (pctG / 100)),
      total: totalPrecio,
      gramos: Math.round(totalGramos),
      horas: Math.round(totalHoras * 10) / 10,
      itemsCount: items.length
    };
  }

  let precioKg = 22000; 
  if(p.filamentoId){
    const f = DB.filamentos.find(x => x.id === p.filamentoId);
    if(f && f.precioKg) precioKg = Number(f.precioKg);
  }

  const merma = Number(DB.config.mermaPct || 8);
  const costoFilamento = (totalGramos * (1 + merma/100)) * (precioKg / 1000);
  const precioKwh = Number(DB.config.precioKwh || 140);
  const consumoW = Number(DB.config.consumoW || 120);
  const costoLuz = (consumoW/1000) * totalHoras * precioKwh;
  const vidaUtil = Number(DB.config.vidaUtilHoras || 4320);
  const costoRepuestos = Number(DB.config.costoRepuestos || 150000);
  const costoAhorroImpresora = vidaUtil > 0 ? (costoRepuestos/vidaUtil) * totalHoras : 0;
  
  const costosTotales = costoFilamento + costoLuz + costoAhorroImpresora;
  const gastoPropioGanancia = Math.max(0, totalPrecio - costosTotales);
  
  return {
    filamento: Math.round(costoFilamento),
    luz: Math.round(costoLuz),
    ahorroImpresora: Math.round(costoAhorroImpresora),
    gastoPropio: Math.round(gastoPropioGanancia),
    total: totalPrecio,
    gramos: Math.round(totalGramos),
    horas: Math.round(totalHoras * 10) / 10,
    itemsCount: items.length
  };
}

let tempOrderItems = [];

function initOrderItemsState(item){
  if(item && item.items && Array.isArray(item.items) && item.items.length > 0){
    tempOrderItems = JSON.parse(JSON.stringify(item.items));
  } else if(item && (item.modelo || item.precio)){
    tempOrderItems = [{
      id: uid(),
      modeloId: item.modeloSelect || '',
      modeloNombre: item.modelo || 'Pieza',
      color: item.color || '',
      cantidad: Number(item.cantidad || 1),
      precio: Number(item.precio || 0),
      gramos: Number(item.gramosUsados || 0),
      tiempoHoras: Number(item.tiempoHoras || 0)
    }];
  } else {
    tempOrderItems = [{
      id: uid(), modeloId: '', modeloNombre: '', color: '', cantidad: 1, precio: 0, gramos: 0, tiempoHoras: 0
    }];
  }
}

function addOrderItemRow(){
  tempOrderItems.push({
    id: uid(), modeloId: '', modeloNombre: '', color: '', cantidad: 1, precio: 0, gramos: 0, tiempoHoras: 0
  });
  renderOrderItemsBuilder();
}

function removeOrderItemRow(index){
  if(tempOrderItems.length <= 1){
    toast('El pedido debe conservar al menos una pieza');
    return;
  }
  tempOrderItems.splice(index, 1);
  renderOrderItemsBuilder();
  recalcOrderTotalsFromItems();
}

function selectCatalogModelForItem(index, modeloId){
  const item = tempOrderItems[index];
  item.modeloId = modeloId;
  if(modeloId){
    const m = DB.modelos.find(x => x.id === modeloId);
    if(m){
      const qty = Number(item.cantidad || 1);
      item.modeloNombre = m.nombre || '';
      item.precio = Number(m.precioSugerido || 0) * qty;
      item.gramos = Number(m.gramos || 0) * qty;
      item.tiempoHoras = Number(m.tiempoHoras || 0) * qty;
    }
  }
  renderOrderItemsBuilder();
  recalcOrderTotalsFromItems();
}

function updateOrderItemField(index, field, value){
  const item = tempOrderItems[index];
  if(field==='cantidad' || field==='precio' || field==='gramos' || field==='tiempoHoras'){
    item[field] = Number(value || 0);
  } else {
    item[field] = value;
  }
  recalcOrderTotalsFromItems();
}

function recalcOrderTotalsFromItems(){
  let sumPrecio = 0; let sumGramos = 0; let sumTiempo = 0;
  tempOrderItems.forEach(it => {
    sumPrecio += Number(it.precio || 0);
    sumGramos += Number(it.gramos || 0);
    sumTiempo += Number(it.tiempoHoras || 0);
  });
  const elPrecio = document.getElementById('fld_precio');
  const elGramos = document.getElementById('fld_gramosUsados');
  const elTiempo = document.getElementById('fld_tiempoHoras');
  if(elPrecio) elPrecio.value = sumPrecio;
  if(elGramos) elGramos.value = sumGramos;
  if(elTiempo) elTiempo.value = sumTiempo;
}

let activeFormType = '';
let activeFormItem = null;

function openForm(type, itemOrId){
  activeFormType = type;
  let item = null;
  if(typeof itemOrId === 'string'){
    const keyMap = {pedido:'pedidos', filamento:'filamentos', modelo:'modelos', gasto:'gastos', stock:'stock', plantilla:'plantillas'};
    const key = keyMap[type];
    if(key && DB[key]) item = DB[key].find(x => x.id === itemOrId);
  } else {
    item = itemOrId;
  }
  activeFormItem = item;

  if(type==='pedido'){
    initOrderItemsState(item);
  }
  const schema = SCHEMAS[type];
  document.getElementById('modalTitle').textContent = schema.title(item);
  const body = document.getElementById('modalBody');
  const rows = {}; const order = [];
  schema.fields.forEach(f => { const r=f.row||f.key; if(!rows[r]){rows[r]=[];order.push(r);} rows[r].push(f); });
  
  body.innerHTML = order.map(r => { 
    const fs = rows[r]; 
    const inner = fs.map(f => renderField(f, item, type)).join(''); 
    return fs.length > 1 ? `<div class="grid grid-cols-2 gap-3">${inner}</div>` : inner; 
  }).join('');
  
  if(type==='pedido'){
    renderOrderItemsBuilder();
    recalcOrderTotalsFromItems();
  }

  document.getElementById('overlay').classList.remove('hidden');
  document.getElementById('overlay').classList.add('flex');
  document.getElementById('modalSaveBtn').onclick = () => saveForm(type, item);
}

        <button type="button" onclick="executeUrlImport()" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-brand-500 hover:bg-brand-600 text-white transition">Importar</button>
      </div>
      <p class="text-[10px] text-slate-500 dark:text-slate-400">Obtiene título, imagen preview, peso y tiempos en 1 clic.</p>

  }

  if(type==='pedido' && f.key==='itemsBuilder'){

      DB.filamentos.map(fl => `<option value="${fl.id}" ${fl.id===val?'selected':''}>${esc(fl.marca||'')} ${esc(fl.tipo)} ${esc(fl.color||'')} (${fl.pesoRestante}g disp.)</option>`)
    );
    return `<div><label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">${f.label}</label><select id="${id}" class="w-full text-xs rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 p-2.5 text-slate-800 dark:text-slate-200">${opts.join('')}</select></div>`;
  }

  if(f.type==='select') return `<div><label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">${f.label}</label><select id="${id}" class="w-full text-xs rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 p-2.5 text-slate-800 dark:text-slate-200">${f.options.map(o => `<option ${o===val?'selected':''}>${o}</option>`).join('')}</select></div>`;
  if(f.type==='textarea') return `<div><label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">${f.label}</label><textarea id="${id}" class="w-full text-xs rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 p-2.5 text-slate-800 dark:text-slate-200 min-h-[60px]">${val||''}</textarea></div>`;
  if(f.type==='color') return `<div><label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">${f.label}</label><input type="color" id="${id}" value="${val||'#026597'}" class="w-full h-9 rounded-xl border border-slate-200 dark:border-slate-800 p-1 bg-slate-50 dark:bg-slate-950 cursor-pointer"></div>`;
  return `<div><label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">${f.label}</label><input type="${f.type}" id="${id}" value="${val!==undefined&&val!==null?val:''}" placeholder="${f.placeholder||''}" class="w-full text-xs rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 p-2.5 text-slate-800 dark:text-slate-200"></div>`;
}

async function executeUrlImport(){
  const input = document.getElementById('importUrlInput');
  if(!input || !input.value.trim()) { toast('Ingresá un enlace válido'); return; }
  
  const targetUrl = input.value.trim();
  toast('Buscando datos del modelo...');

  try {
    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
    const res = await fetch(proxyUrl);
    const data = await res.json();
    const html = data.contents;

    if(html){
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');

      const ogTitle = doc.querySelector('meta[property="og:title"]')?.content || doc.title || '';
      const ogImage = doc.querySelector('meta[property="og:image"]')?.content || '';

      const fldNombre = document.getElementById('fld_nombre');
      const fldFoto = document.getElementById('fld_foto');
      const fldFuente = document.getElementById('fld_fuenteUrl');

      if(fldNombre && ogTitle) fldNombre.value = ogTitle.replace(/\s*\|.*$/, '').trim();
      if(fldFoto && ogImage) fldFoto.value = ogImage;
      if(fldFuente) fldFuente.value = targetUrl;

      toast('¡Datos e imagen importados con éxito!');
    } else {
      toast('No se pudo extraer la info automática. Podés cargarla manualmente.');
    }
  } catch(e) {
    toast('No se pudo acceder al enlace. Cargá la imagen y datos a mano.');
  }
}

let pendingDeleteTarget = null;

function confirmDelete(key, id){
  const list = DB[key] || [];
  const item = list.find(x => x.id === id);
  const label = item ? (item.nombre || item.cliente || item.titulo || item.marca || 'este elemento') : 'este elemento';
  
  pendingDeleteTarget = { key, id, label };
  const textEl = document.getElementById('deleteConfirmText');
  if(textEl) textEl.textContent = `¿Estás seguro de eliminar "${label}"?`;
  
  const modal = document.getElementById('deleteConfirmOverlay');
  if(modal){
    modal.classList.remove('hidden');
    modal.classList.add('flex');
  }
  
  document.getElementById('confirmDeleteBtn').onclick = executeDelete;
}

function closeDeleteModal(){
  const modal = document.getElementById('deleteConfirmOverlay');
  if(modal){
    modal.classList.add('hidden');
    modal.classList.remove('flex');
  }
  pendingDeleteTarget = null;
}

async function executeDelete(){
  if(!pendingDeleteTarget) return;
  const { key, id } = pendingDeleteTarget;
  const idx = DB[key].findIndex(x => x.id === id);
  if(idx > -1){
    DB[key].splice(idx, 1);
    await save(key);
    toast('Registro eliminado');
    renderNav();
    renderPage();
  }
  closeDeleteModal();
}

async function saveForm(type, item){
  const schema = SCHEMAS[type];
  const data = item ? {...item} : {id: uid()};
  let valid = true;

  schema.fields.forEach(f => {
    if(f.key==='itemsBuilder' || f.type==='import_url' || f.type==='file_3d') return;
    const el = document.getElementById('fld_' + f.key);
    if(!el) return;
    let v = f.type==='number' ? (el.value===''? 0 : Number(el.value)) : el.value;
    if(f.required && !v){ valid=false; el.classList.add('border-rose-500'); }
    data[f.key] = v;
  });

  const fileInput = document.getElementById('fld_file3D');
  if(fileInput && fileInput.files && fileInput.files[0]){
    const file = fileInput.files[0];
    const fileKey = '3d_' + data.id;
    const saved = await save3DFileInDB(fileKey, file);
    if(saved){
      data.file3DKey = fileKey;
      data.file3DName = file.name;
    }
  }

  if(type==='pedido'){
    data.items = tempOrderItems.map(it => ({
      id: it.id || uid(),
      modeloId: it.modeloId || '',
      modeloNombre: it.modeloNombre || 'Pieza',
      color: it.color || '',
      cantidad: Number(it.cantidad || 1),
      precio: Number(it.precio || 0),
      gramos: Number(it.gramos || 0),
      tiempoHoras: Number(it.tiempoHoras || 0)
    }));
    
    data.modelo = data.items.map(i => `${i.cantidad}x ${i.modeloNombre}`).join(' + ');
    if(!data.precio) data.precio = data.items.reduce((s,i) => s + i.precio, 0);
    if(!data.gramosUsados) data.gramosUsados = data.items.reduce((s,i) => s + i.gramos, 0);
  }

  if(!valid){ toast('Completá los campos obligatorios'); return; }

  const map = {pedido:'pedidos', filamento:'filamentos', modelo:'modelos', gasto:'gastos', stock:'stock', plantilla:'plantillas'};
  const key = map[type];
  const idx = DB[key].findIndex(x => x.id === data.id);

  if(idx > -1) DB[key][idx] = data; else DB[key].unshift(data);

  if(type==='pedido' && data.filamentoId && data.gramosUsados > 0 && !data.stockDescontado){
    if(['Listo','Enviado','Entregado'].includes(data.estado)){
      const f = DB.filamentos.find(x => x.id === data.filamentoId);
      if(f){
        const merma = Number(DB.config.mermaPct || 8);
        const totalUsar = Number(data.gramosUsados) * (1 + merma/100);
        f.pesoRestante = Math.max(0, Number(f.pesoRestante || 0) - totalUsar);
        await save('filamentos');
        data.stockDescontado = true;
      }
    }
  }

  await save(key);
  closeModal(); 
  renderNav(); 
  renderPage();
  toast('Información guardada correctamente');
}

  }
  if(active3DRenderer){
    try { active3DRenderer.dispose(); } catch(e){}

  }
}

async function init3DCanvas(fileKey, fileName){
  const container = document.getElementById('canvas3dContainer');
  if(!container) return;

  const width = container.clientWidth;
  const height = container.clientHeight;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x070a10);

  const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
  camera.position.set(0, 25, 45);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(width, height);
  active3DRenderer = renderer;

  container.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.target.set(0, 5, 0);

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
  scene.add(ambientLight);
  const dirLight1 = new THREE.DirectionalLight(0x36affb, 1.2);
  dirLight1.position.set(30, 50, 30);
  scene.add(dirLight1);
  const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.6);
  dirLight2.position.set(-30, -20, -30);
  scene.add(dirLight2);

  const gridHelper = new THREE.GridHelper(80, 20, 0x026597, 0x1e293b);
  gridHelper.position.y = -10;
  scene.add(gridHelper);

  const loadingEl = document.getElementById('canvas3dLoading');

  if(!fileKey) {
    if(loadingEl) {
      loadingEl.innerHTML = `
        <div class="text-center p-4 space-y-2">
          <p class="text-amber-400 font-bold text-xs">⚠️ Sin archivo 3D adjunto</p>
          <p class="text-slate-400 text-[11px]">Esta pieza no tiene un archivo .STL o .3MF subido aún.</p>
          <p class="text-slate-500 text-[10px]">Hacé clic en 'Editar' en el catálogo para subir tu modelo 3D real.</p>
        </div>
      `;
    }
    renderEmptyBedOutline(scene);
    start3DLoop(controls, renderer, scene, camera);
    return;
  }

  let loadedBlob = await get3DFileFromDB(fileKey);

  if(loadedBlob){
    const ext = (fileName || fileKey || '').split('.').pop().toLowerCase();

    if(ext === 'stl' || ext.includes('stl')){
      try {
        const arrayBuffer = await loadedBlob.arrayBuffer();
        let geometry;
        if (typeof THREE.STLLoader !== 'undefined') {
          const loader = new THREE.STLLoader();
          geometry = loader.parse(arrayBuffer);
        } else {
          throw new Error('STLLoader no disponible');
        }
        geometry.computeVertexNormals();
        const material = new THREE.MeshStandardMaterial({ 
          color: 0x026597, 
          roughness: 0.35, 
          metalness: 0.1, 
          side: THREE.DoubleSide 
        });
        const mesh = new THREE.Mesh(geometry, material);
        prepare3DObjectForScene(mesh, scene);
        if(loadingEl) loadingEl.style.display = 'none';
      } catch(err) {
        console.error('Error STL:', err);
        show3DErrorMessage('Error al procesar archivo STL: ' + err.message);
      }
    } else {
      try {
        const arrayBuffer = await loadedBlob.arrayBuffer();
        const object = await parse3MFBuffer(arrayBuffer);
        prepare3DObjectForScene(object, scene);
        if(loadingEl) loadingEl.style.display = 'none';
      } catch(err) {
        console.error('Error 3MF:', err);
        show3DErrorMessage('Error al procesar geometría 3MF: ' + err.message);
      }
    }
  } else {
    show3DErrorMessage('El archivo no se encontró en el almacenamiento local.');
  }

  start3DLoop(controls, renderer, scene, camera);
}

function start3DLoop(controls, renderer, scene, camera) {
  function animate() {
    active3DAnimId = requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();
}

function prepare3DObjectForScene(object, scene) {
  object.rotation.x = -Math.PI / 2;
  object.updateMatrixWorld(true);

  const containerGroup = new THREE.Group();
  containerGroup.add(object);

  const box = new THREE.Box3().setFromObject(object);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());

  object.position.set(-center.x, -center.y, -center.z);

  const maxDim = Math.max(size.x, size.y, size.z) || 20;
  const targetSize = 30;
  const scale = targetSize / maxDim;
  containerGroup.scale.set(scale, scale, scale);
  containerGroup.updateMatrixWorld(true);

  const finalBox = new THREE.Box3().setFromObject(containerGroup);
  containerGroup.position.y = -10 - finalBox.min.y;

  scene.add(containerGroup);
  return containerGroup;
}

function show3DErrorMessage(msg) {
  const loadingEl = document.getElementById('canvas3dLoading');
  if(loadingEl) {
    loadingEl.innerHTML = `
      <div class="text-center p-4 space-y-2">
        <p class="text-rose-400 font-bold text-xs">❌ Error al cargar modelo 3D</p>
        <p class="text-slate-400 text-xs">${esc(msg)}</p>
        <p class="text-slate-500 text-[10px]">Verificá que el archivo .STL o .3MF no esté dañado.</p>
      </div>
    `;
  }
}

function renderEmptyBedOutline(scene) {
  const geometry = new THREE.BoxGeometry(40, 0.5, 40);

  bed.position.y = -10.25;
  scene.add(bed);
}

function getNodesByLocalName(parent, localName) {
  if (!parent) return [];
  const target = localName.toLowerCase();
  const all = parent.getElementsByTagName('*');
  const result = [];
  for (let i = 0; i < all.length; i++) {
    const node = all[i];
    const name = node.localName || node.nodeName.replace(/^.*:/, '');
    if (name && name.toLowerCase() === target) {
      result.push(node);
    }
  }
  return result;
}

function parse3MFBuffer(arrayBuffer) {
  return new Promise((resolve, reject) => {
    try {
      if (typeof fflate === 'undefined') {
        reject(new Error('Biblioteca fflate no disponible'));
        return;
      }
      const unzipped = fflate.unzipSync(new Uint8Array(arrayBuffer));
      let modelXmlStr = null;
      for (const path in unzipped) {
        if (path.toLowerCase().endsWith('.model')) {
          modelXmlStr = fflate.strFromU8(unzipped[path]);
          break;
        }
      }
      if (!modelXmlStr) {
        reject(new Error('No se encontró archivo .model dentro del archivo 3MF'));
        return;
      }

      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(modelXmlStr, 'text/xml');
      const group = new THREE.Group();
      const objectsMap = {};

      const parseMatrix = (transformStr) => {
        if (!transformStr) return null;
        const nums = transformStr.trim().split(/\s+/).map(Number);
        if (nums.length < 12) return null;
        const mat = new THREE.Matrix4();
        mat.set(
          nums[0], nums[3], nums[6], nums[9],
          nums[1], nums[4], nums[7], nums[10],
          nums[2], nums[5], nums[8], nums[11],
          0,       0,       0,       1
        );
        return mat;
      };

      const objects = getNodesByLocalName(xmlDoc, 'object');
      for (let i = 0; i < objects.length; i++) {
        const objNode = objects[i];
        const id = objNode.getAttribute('id');
        const meshNodes = getNodesByLocalName(objNode, 'mesh');

        if (meshNodes.length > 0) {
          const meshNode = meshNodes[0];
          const verticesNodes = getNodesByLocalName(meshNode, 'vertices');
          const trianglesNodes = getNodesByLocalName(meshNode, 'triangles');

          if (verticesNodes.length > 0 && trianglesNodes.length > 0) {
            const vNodes = getNodesByLocalName(verticesNodes[0], 'vertex');
            const positions = new Float32Array(vNodes.length * 3);
            for (let j = 0; j < vNodes.length; j++) {
              positions[j * 3] = parseFloat(vNodes[j].getAttribute('x') || 0);
              positions[j * 3 + 1] = parseFloat(vNodes[j].getAttribute('y') || 0);
              positions[j * 3 + 2] = parseFloat(vNodes[j].getAttribute('z') || 0);
            }

            const tNodes = getNodesByLocalName(trianglesNodes[0], 'triangle');
            const indices = [];
            for (let j = 0; j < tNodes.length; j++) {
              const v1 = parseInt(tNodes[j].getAttribute('v1'), 10);
              const v2 = parseInt(tNodes[j].getAttribute('v2'), 10);
              const v3 = parseInt(tNodes[j].getAttribute('v3'), 10);
              if (!isNaN(v1) && !isNaN(v2) && !isNaN(v3)) {
                indices.push(v1, v2, v3);
              }
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            if (indices.length > 0) {
              geometry.setIndex(indices);
            }
            geometry.computeVertexNormals();

            objectsMap[id] = { geometry, components: [] };
          }
        } else {
          const componentsNodes = getNodesByLocalName(objNode, 'components');
          if (componentsNodes.length > 0) {
            const cNodes = getNodesByLocalName(componentsNodes[0], 'component');
            const compList = [];
            for (let j = 0; j < cNodes.length; j++) {
              const objId = cNodes[j].getAttribute('objectid');
              const transform = cNodes[j].getAttribute('transform');
              compList.push({ objectId: objId, transform: parseMatrix(transform) });
            }
            objectsMap[id] = { geometry: null, components: compList };
          }
        }
      }

      const defaultMaterial = new THREE.MeshStandardMaterial({
        color: 0x026597,
        roughness: 0.35,
        metalness: 0.1,
        side: THREE.DoubleSide
      });

      const buildMeshForObject = (id) => {
        const objData = objectsMap[id];
        if (!objData) return null;

        if (objData.geometry) {
          return new THREE.Mesh(objData.geometry, defaultMaterial);
        } else if (objData.components && objData.components.length > 0) {
          const compGroup = new THREE.Group();
          for (const comp of objData.components) {
            const childMesh = buildMeshForObject(comp.objectId);
            if (childMesh) {
              const cloned = childMesh.clone();
              if (comp.transform) {
                cloned.applyMatrix4(comp.transform);
              }
              compGroup.add(cloned);
            }
          }
          return compGroup.children.length > 0 ? compGroup : null;
        }
        return null;
      };

      const buildItems = getNodesByLocalName(xmlDoc, 'item');
      if (buildItems.length > 0) {
        for (let i = 0; i < buildItems.length; i++) {
          const item = buildItems[i];
          const objId = item.getAttribute('objectid');
          const transformStr = item.getAttribute('transform');
          const itemMesh = buildMeshForObject(objId);

          if (itemMesh) {
            if (transformStr) {
              const mat = parseMatrix(transformStr);
              if (mat) itemMesh.applyMatrix4(mat);
            }
            group.add(itemMesh);
          }
        }
      } else {
        for (const id in objectsMap) {
          const mesh = buildMeshForObject(id);
          if (mesh) group.add(mesh);
        }
      }

      if (group.children.length === 0) {
        reject(new Error('No se encontraron geometrías válidas en la estructura 3MF'));
      } else {
        resolve(group);
      }
    } catch (e) {
      reject(e);
    }
  });
}

const SECTIONS = [
  {id:'dashboard', label:'Resumen', icon:'dashboard'},
  {id:'pedidos', label:'Pedidos', icon:'pedidos'},
  {id:'clientes', label:'Clientes', icon:'clientes'},
  {id:'filamentos', label:'Filamentos', icon:'filamento'},

  {id:'stock', label:'Stock Impreso', icon:'stock'},
  {id:'presupuestos', label:'Presupuestos', icon:'presupuestos'},

  {id:'gastos', label:'Gastos Taller', icon:'gastos'},
  {id:'finanzas', label:'Finanzas e Historial', icon:'finanzas'},
  {id:'config', label:'Configuración', icon:'config'},
];

let current = 'dashboard';
let currentSearchQuery = '';

function renderNav(){
  const nav = document.getElementById('nav');
  if(!nav) return;
  nav.innerHTML = SECTIONS.map(s => {
    let badge = '';
    if(s.id === 'pedidos'){
      const n = DB.pedidos.filter(p => !['Entregado','Cancelado'].includes(p.estado)).length;
      if(n) badge = `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-brand-500 text-white font-mono ml-auto">${n}</span>`;
    }
    if(s.id === 'filamentos'){
      const n = DB.filamentos.filter(f => (f.pesoRestante||0) <= 150).length;
      if(n) badge = `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-500 text-white font-mono ml-auto">${n}</span>`;
    }
    const isActive = s.id === current;
    return `<button class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all duration-200 ${isActive ? 'bg-brand-500/15 text-brand-500 dark:text-brand-400 border border-brand-500/30 font-bold shadow-sm' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60 hover:text-slate-900 dark:hover:text-white'}" onclick="goTo('${s.id}')">
      <span class="${isActive ? 'text-brand-500' : 'text-slate-400'}">${ICONS[s.icon]}</span>
      <span>${s.label}</span>
      ${badge}
    </button>`;
  }).join('');

  const bNav = document.getElementById('bottomNav');
  if(bNav){
    const bSections = ['dashboard','pedidos','stock','plantillas','config'];
    bNav.innerHTML = bSections.map(id => {
      const s = SECTIONS.find(x => x.id === id);
      if(!s) return '';
      const isActive = s.id === current;
      return `<button class="flex flex-col items-center gap-1 p-2 text-[10px] font-semibold ${isActive ? 'text-brand-500 font-bold' : 'text-slate-500 dark:text-slate-400'}" onclick="goTo('${id}')">
        ${ICONS[s.icon]}
        <span>${s.label}</span>
      </button>`;
    }).join('');
  }
}

function copyTemplateText(id){
  const p = DB.plantillas.find(x => x.id === id);
  if(!p) return;
  const dummy = document.createElement('textarea');
  document.body.appendChild(dummy);
  dummy.value = p.texto;
  dummy.select();
  document.execCommand('copy');
  document.body.removeChild(dummy);
  toast('Texto copiado al portapapeles 📋 Listo para pegar en Marketplace');
}

function renderClientes(){
  const clientsMap = {};
  DB.pedidos.forEach(p => {
    const name = (p.cliente || 'Sin Nombre').trim();
    if(!clientsMap[name]){
      clientsMap[name] = { name, contacto: p.contacto || '', pedidosCount: 0, totalGastado: 0, ultimoPedido: p.fecha };
    }
    clientsMap[name].pedidosCount += 1;
    clientsMap[name].totalGastado += Number(p.precio || 0);
    if(p.fecha && p.fecha > clientsMap[name].ultimoPedido) clientsMap[name].ultimoPedido = p.fecha;
    if(!clientsMap[name].contacto && p.contacto) clientsMap[name].contacto = p.contacto;
  });

  let list = Object.values(clientsMap).sort((a,b) => b.totalGastado - a.totalGastado);

  if(currentSearchQuery){
    const q = currentSearchQuery.toLowerCase();
    list = list.filter(c => c.name.toLowerCase().includes(q) || c.contacto.toLowerCase().includes(q));
  }

  const searchHeader = `
    <div class="mb-4">
      <input type="text" placeholder="🔍 Buscar cliente o teléfono..." value="${esc(currentSearchQuery)}" oninput="currentSearchQuery=this.value; renderPage()" class="w-full max-w-md text-xs rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-200 p-2.5">
    </div>
  `;

  if(!list.length) return searchHeader + `<div class="p-12 text-center rounded-2xl glass-card"><p class="text-xs font-bold text-slate-400 uppercase tracking-wider font-mono">Sin clientes registrados</p><p class="text-xs text-slate-500 mt-1">Se generarán automáticamente cuando cargues pedidos.</p></div>`;

  return searchHeader + `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">` + list.map(c => `
    <div class="p-5 rounded-2xl glass-card space-y-3 transition hover:border-brand-500/40">

        <div class="font-bold text-sm text-slate-900 dark:text-white">${esc(c.name)}</div>

      <div class="text-xs text-slate-500">📱 ${esc(c.contacto || 'Sin contacto')}</div>
      <div class="grid grid-cols-2 gap-2 p-3 rounded-xl bg-slate-50 dark:bg-slate-950/80 font-mono text-xs">
        <div><span class="block text-[9px] font-sans font-semibold text-slate-400 uppercase">Facturado</span><b class="text-brand-500">${money(c.totalGastado)}</b></div>
        <div><span class="block text-[9px] font-sans font-semibold text-slate-400 uppercase">Último</span>${fmtDate(c.ultimoPedido)}</div>

}

async function adjustStockQty(id, delta){
  const item = DB.stock.find(x => x.id === id);
  if(item){
    item.cantidad = Math.max(0, Number(item.cantidad||0) + delta);
    await save('stock');
    renderPage();
  }
}

function attachPresupuestoCalcListeners(){
  ['calcGramos', 'calcHoras', 'calcFilamento', 'calcMultiplicador'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.oninput = runPresupuestoCalc;
  });
  runPresupuestoCalc();
}

function runPresupuestoCalc(){
  const gramos = Number(document.getElementById('calcGramos')?.value || 0);
  const horas = Number(document.getElementById('calcHoras')?.value || 0);
  const mult = Number(document.getElementById('calcMultiplicador')?.value || 3);
  const filamentoId = document.getElementById('calcFilamento')?.value;

  let precioKg = 22000;
  if(filamentoId){
    const f = DB.filamentos.find(x => x.id === filamentoId);
    if(f && f.precioKg) precioKg = Number(f.precioKg);
  }

  const merma = Number(DB.config.mermaPct || 8);
  const costoFilamento = (gramos * (1 + merma/100)) * (precioKg / 1000);
  const precioKwh = Number(DB.config.precioKwh || 140);
  const consumoW = Number(DB.config.consumoW || 120);
  const costoLuz = (consumoW/1000) * horas * precioKwh;
  const vidaUtil = Number(DB.config.vidaUtilHoras || 4320);
  const costoRepuestos = Number(DB.config.costoRepuestos || 150000);
  const costoAhorro = vidaUtil > 0 ? (costoRepuestos/vidaUtil) * horas : 0;

  const costoBase = costoFilamento + costoLuz + costoAhorro;
  const precioVenta = Math.round(costoBase * mult);

  if(document.getElementById('resFilamento')) document.getElementById('resFilamento').textContent = money(costoFilamento);
  if(document.getElementById('resLuz')) document.getElementById('resLuz').textContent = money(costoLuz);
  if(document.getElementById('resAhorro')) document.getElementById('resAhorro').textContent = money(costoAhorro);
  if(document.getElementById('resTotal')) document.getElementById('resTotal').textContent = money(precioVenta);
}

function copiarPresupuestoWa(){
  const nombre = document.getElementById('calcNombre')?.value || 'Impresión 3D';
  const total = document.getElementById('resTotal')?.textContent || '$0';
  const text = `Hola! 👋 Te paso el presupuesto estimado para "${nombre}":\n\n📌 Total: ${total}\n\nQuedo atento a tus comentarios para coordinar la impresión! 🚀`;
  
  const dummy = document.createElement('textarea');
  document.body.appendChild(dummy);
  dummy.value = text;
  dummy.select();
  document.execCommand('copy');
  document.body.removeChild(dummy);
  toast('Presupuesto copiado al portapapeles');
}

function getEstadoBadge(estado){
  const st = estado || 'Pendiente';
  let cls = 'bg-slate-500/15 text-slate-600 dark:text-slate-400 border-slate-500/30';
  
  if(st === 'Pendiente') {
    cls = 'bg-amber-500/15 text-amber-600 dark:text-amber-400 border-amber-500/30';
  } else if(st === 'Imprimiendo') {
    cls = 'bg-sky-500/15 text-sky-600 dark:text-sky-400 border-sky-500/30';
  } else if(st === 'Listo') {
    cls = 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border-emerald-500/30';
  } else if(st === 'Enviado') {
    cls = 'bg-purple-500/15 text-purple-600 dark:text-purple-400 border-purple-500/30';
  } else if(st === 'Entregado') {

  } else if(st === 'Cancelado') {

  return `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold badge-dot border ${cls}">${esc(st)}</span>`;
}

        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <label class="p-4 rounded-xl border cursor-pointer transition ${modo==='costo_real' ? 'border-brand-500 bg-brand-500/10' : 'border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-950/40'}">
          <div class="flex items-center gap-2 font-bold text-xs text-slate-900 dark:text-white mb-1">
            <input type="radio" name="cfgModoReparto" value="costo_real" ${modo==='costo_real'?'checked':''} onchange="toggleConfigRepartoView(this.value)">
            <span>Modo Automático por Costo Real</span>
          </div>
          <p class="text-[11px] text-slate-500">Calcula filamento por gramos reales, luz por Watts/horas y amortización. El sobrante es tu Ganancia Neta.</p>
        </label>

        <label class="p-4 rounded-xl border cursor-pointer transition ${modo==='porcentajes' ? 'border-brand-500 bg-brand-500/10' : 'border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-950/40'}">
          <div class="flex items-center gap-2 font-bold text-xs text-slate-900 dark:text-white mb-1">
            <input type="radio" name="cfgModoReparto" value="porcentajes" ${modo==='porcentajes'?'checked':''} onchange="toggleConfigRepartoView(this.value)">
            <span>Modo Porcentajes Fijos Personalizados</span>
          </div>
          <p class="text-[11px] text-slate-500">Reparte la venta total según los porcentajes fijos que asignes manualmente a cada caja.</p>
        </label>
      </div>

      <div id="panelPorcentajesConfig" class="${modo==='porcentajes' ? '' : 'hidden'} pt-3 space-y-3 border-t border-slate-200 dark:border-slate-800">
        <div class="text-xs font-bold text-brand-500 font-mono">Definir Porcentajes de Reparto (% sobre el precio de venta):</div>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 mb-1">💰 % Ganancia Neta</label>
            <input type="number" id="cfgPctGanancia" value="${cfg.pctGanancia||50}" min="0" max="100" class="w-full text-xs rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 p-2.5 text-slate-800 dark:text-slate-200 font-mono">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 mb-1">🖨️ % Fondo Máquina</label>
            <input type="number" id="cfgPctFondoImpresora" value="${cfg.pctFondoImpresora||20}" min="0" max="100" class="w-full text-xs rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 p-2.5 text-slate-800 dark:text-slate-200 font-mono">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 mb-1">🧵 % Filamento</label>
            <input type="number" id="cfgPctFilamento" value="${cfg.pctFilamento||20}" min="0" max="100" class="w-full text-xs rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 p-2.5 text-slate-800 dark:text-slate-200 font-mono">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 mb-1">⚡ % Luz / Electricidad</label>
            <input type="number" id="cfgPctLuz" value="${cfg.pctLuz||10}" min="0" max="100" class="w-full text-xs rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 p-2.5 text-slate-800 dark:text-slate-200 font-mono">
          </div>
        </div>
      </div>
    </div>

    <div class="p-6 rounded-2xl glass-card space-y-4">
      <h3 class="text-sm font-bold text-slate-900 dark:text-white uppercase font-mono">⚡ Costos Energéticos y de Desgaste</h3>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Precio kWh ($)</label>
          <input type="number" id="cfgPrecioKwh" value="${cfg.precioKwh||140}" class="w-full text-xs rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 p-2.5 text-slate-800 dark:text-slate-200">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Consumo Impresora (W)</label>
          <input type="number" id="cfgConsumoW" value="${cfg.consumoW||120}" class="w-full text-xs rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 p-2.5 text-slate-800 dark:text-slate-200">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Vida Útil (Horas)</label>
          <input type="number" id="cfgVidaUtil" value="${cfg.vidaUtilHoras||4320}" class="w-full text-xs rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 p-2.5 text-slate-800 dark:text-slate-200">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Costo Repuestos ($)</label>
          <input type="number" id="cfgCostoRepuestos" value="${cfg.costoRepuestos||150000}" class="w-full text-xs rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 p-2.5 text-slate-800 dark:text-slate-200">
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">% Merma / Pérdida Filamento (Soportes, Purga, Fallos)</label>
        <input type="number" id="cfgMermaPct" value="${cfg.mermaPct||8}" class="w-full max-w-xs text-xs rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 p-2.5 text-slate-800 dark:text-slate-200">
      </div>
    </div>

    <div>
      <button onclick="saveConfigSettings()" class="px-6 py-3 rounded-xl text-xs font-bold bg-brand-500 hover:bg-brand-600 text-white shadow-glow transition">Guardar Configuración de Taller</button>
    </div>
  </div>`;
}

function toggleConfigRepartoView(val){
  const p = document.getElementById('panelPorcentajesConfig');
  if(p){
    if(val === 'porcentajes') p.classList.remove('hidden');
    else p.classList.add('hidden');
  }
}

async function saveConfigSettings(){
  const modoRadio = document.querySelector('input[name="cfgModoReparto"]:checked');
  if(modoRadio) DB.config.modoReparto = modoRadio.value;

  const elGan = document.getElementById('cfgPctGanancia');
  const elFon = document.getElementById('cfgPctFondoImpresora');
  const elFil = document.getElementById('cfgPctFilamento');
  const elLuz = document.getElementById('cfgPctLuz');

  if(elGan) DB.config.pctGanancia = Number(elGan.value || 50);
  if(elFon) DB.config.pctFondoImpresora = Number(elFon.value || 20);
  if(elFil) DB.config.pctFilamento = Number(elFil.value || 20);
  if(elLuz) DB.config.pctLuz = Number(elLuz.value || 10);

  const elKwh = document.getElementById('cfgPrecioKwh');
  const elW = document.getElementById('cfgConsumoW');
  const elVida = document.getElementById('cfgVidaUtil');
  const elRep = document.getElementById('cfgCostoRepuestos');
  const elMer = document.getElementById('cfgMermaPct');

  if(elKwh) DB.config.precioKwh = Number(elKwh.value || 140);
  if(elW) DB.config.consumoW = Number(elW.value || 120);
  if(elVida) DB.config.vidaUtilHoras = Number(elVida.value || 4320);
  if(elRep) DB.config.costoRepuestos = Number(elRep.value || 150000);
  if(elMer) DB.config.mermaPct = Number(elMer.value || 8);

  await save('config');
  toast('Configuración guardada correctamente');
  renderPage();
}

function applyTheme(t){
  if (t === 'dark') {
    document.documentElement.classList.add('dark');
  } else {
    document.documentElement.classList.remove('dark');
  }
  const lbl = document.getElementById('themeLabel');
  if(lbl) lbl.textContent = t==='dark' ? 'Modo Oscuro' : 'Modo Claro';
}

function toggleTheme(){
  const cur = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
  applyTheme(cur);
  DB.config.theme = cur;
  save('config');
}

(async function init(){
  await loadAll();
  applyTheme(DB.config.theme || 'dark');
  renderNav();
  renderPage();
  const loader = document.getElementById('appLoading');
  if(loader){
    loader.style.opacity = '0';
    setTimeout(() => { loader.style.display = 'none'; }, 300);
  }
})();
</script>
</body>
</html>
